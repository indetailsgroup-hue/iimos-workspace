name: Chromatic PR Comment

on:
  workflow_run:
    workflows: ["Chromatic Visual Regression"]
    types: [completed]

permissions:
  pull-requests: write
  checks: read

jobs:
  comment:
    name: Post Chromatic build link as PR comment
    runs-on: ubuntu-latest

    steps:
      - name: Post Chromatic build link
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const headBranch = run.head_branch;
            const headSha   = run.head_sha;
            const conclusion = run.conclusion; // 'success' | 'failure' | 'cancelled' | null

            // Find the open PR for this branch
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              head:  `${context.repo.owner}:${headBranch}`,
              state: 'open',
            });

            if (prs.length === 0) {
              console.log(`No open PR found for branch: ${headBranch}`);
              return;
            }

            const pr = prs[0];

            // Locate the Chromatic check run to get its details_url (build link)
            const { data: checkData } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              ref:   headSha,
            });

            const chromaticCheck = checkData.check_runs.find(
              (c) => (c.app && c.app.slug === 'chromatic-com') ||
                     (c.name && c.name.toLowerCase().includes('chromatic'))
            );

            const buildUrl =
              chromaticCheck?.details_url ??
              `https://www.chromatic.com/builds?appId=6a916bc5171efe1f3f09f56e`;

            // Try to extract story count from check output summary
            const summary    = chromaticCheck?.output?.summary ?? '';
            const storyMatch = summary.match(/(\d+)\s+stor/i);
            const storyCount = storyMatch ? storyMatch[1] : '—';

            const statusEmoji = conclusion === 'success' ? '✅' : '❌';
            const statusText  = conclusion === 'success' ? 'passed' : (conclusion ?? 'unknown');

            const body = [
              `## ${statusEmoji} Chromatic Visual Regression — ${statusText}`,
              '',
              '| Field | Value |',
              '|---|---|',
              `| **Build** | [View on Chromatic](${buildUrl}) |`,
              `| **Branch** | \`${headBranch}\` |`,
              `| **Commit** | \`${headSha.slice(0, 7)}\` |`,
              `| **Stories checked** | ${storyCount} |`,
              '',
              `_Triggered by [workflow run #${run.id}](${run.html_url})_`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: pr.number,
              body,
            });

            console.log(`Comment posted on PR #${pr.number}`);
