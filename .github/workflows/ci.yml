name: FPR Field-Purchase CI

on:
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "*.sql"
      - "*.ts"
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/**"
  push:
    branches: ["main"]
    paths:
      - "*.sql"
      - "supabase/migrations/**"
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions tab (e.g. after direct pushes to main)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Deno unit + integration tests (runs on every PR)
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Deno Tests (21 suites)
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET:       ${{ secrets.SUPABASE_JWT_SECRET }}
      SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
      LINE_FPR_CHANNEL_SECRET:   ${{ secrets.LINE_FPR_CHANNEL_SECRET }}
      LINE_FPR_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_FPR_CHANNEL_ACCESS_TOKEN }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_API_BASE:             ${{ secrets.LINE_API_BASE }}
      DISPATCH_LIMIT:            "50"
      VERTICAL:                  "field_purchase"
      RATE_LIMIT_PER_MIN:        "30"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      # ── Unit tests (no network required — always run) ──────────────────────
      - name: Unit tests — line_webhook_handler
        run: |
          deno test --allow-env --no-check line_webhook_handler_test.ts

      - name: Unit tests — line_oa_dispatch_worker
        run: |
          deno test --allow-env --no-check line_oa_dispatch_worker_test.ts

      # ── Integration tests (require Supabase secrets) ───────────────────────
      - name: Integration tests — approval queue
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_get_fpr_approval_queue_integration_test.ts

      - name: Integration tests — close request
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_close_field_purchase_request_integration_test.ts

      - name: Integration tests — escalate request
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_escalate_field_purchase_request_integration_test.ts

      - name: Integration tests — reopen request
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_reopen_field_purchase_request_integration_test.ts

      - name: Integration tests — bulk close
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_bulk_close_field_purchase_request_integration_test.ts

      - name: Integration tests — bulk reopen
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_bulk_reopen_field_purchase_request_integration_test.ts

      - name: Integration tests — bulk escalate
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_bulk_escalate_field_purchase_request_integration_test.ts

      - name: Integration tests — bulk reject
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_bulk_reject_field_purchase_request_integration_test.ts

      - name: Integration tests — bulk approve
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_bulk_approve_field_purchase_request_integration_test.ts

      - name: Integration tests — bulk approve with notifications
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_bulk_approve_with_notifications_integration_test.ts

      - name: Integration tests — retry FPR notifications
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_retry_fpr_notifications_integration_test.ts

      - name: Integration tests — dispatch worker
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            line_oa_dispatch_worker_integration_test.ts

      - name: Integration tests — cancel request
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_cancel_field_purchase_request_integration_test.ts

      - name: Integration tests — bulk cancel
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_bulk_cancel_field_purchase_request_integration_test.ts

      - name: Integration tests — uncancel request
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_uncancel_field_purchase_request_integration_test.ts

      - name: Integration tests — bulk uncancel
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_bulk_uncancel_field_purchase_request_integration_test.ts

      - name: Integration tests — dispatch drain retry
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            line_oa_dispatch_worker_drain_retry_integration_test.ts

      - name: Integration tests — bulk force close
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            rpc_bulk_force_close_field_purchase_request_integration_test.ts

      - name: Integration tests — dead letter alert
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            fpr_dead_letter_alert_integration_test.ts

      - name: Integration tests — e2e smoke (remote, secrets-gated)
        if: env.SUPABASE_URL != ''
        run: |
          deno test --allow-env --allow-net --no-check \
            supabase/tests/e2e_smoke_test.ts

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Apply migrations to Supabase (runs only on push to main)
  # ───────────────────────────────────────────────────────────────────────────
  migrate:
    name: Apply Migrations (0176→0215)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply migrations 0176→0215
        run: |
          chmod +x scripts/apply_migrations.sh
          ./scripts/apply_migrations.sh

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3: Deploy Supabase Edge Functions (runs only on push to main)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    needs: migrate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy field-purchase-line (LINE webhook handler)
        run: |
          supabase functions deploy field-purchase-line \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy line-oa-dispatch-worker
        run: |
          supabase functions deploy line-oa-dispatch-worker \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────────
  # Job 4: E2E Smoke Tests — local Supabase via `supabase start`
  #   Spins up a full local Postgres+Auth stack, auto-applies all migrations
  #   in supabase/migrations/ (CI prereq stubs + 0176→0215), then runs the
  #   Deno e2e_smoke_test.ts against it.
  #   Runs on every PR and workflow_dispatch so regressions are caught before merge.
  # ───────────────────────────────────────────────────────────────────────────
  e2e-smoke:
    name: E2E Smoke Tests (local Supabase)
    runs-on: ubuntu-latest
    # Runs in parallel with Job 1 — does not need remote secrets
    needs: []

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Deno runtime ───────────────────────────────────────────────────────
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      # ── Supabase CLI ───────────────────────────────────────────────────────
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # ── Write e2e prereq migration stubs ──────────────────────────────────
      # These files are written to the runner's checkout only — NOT committed.
      #
      # File 1 (0000): creates organizations + org_members with exact column
      # names expected by 0173_rls_isolation_hardening.sql's safety pre-check.
      #
      # File 2 (0172_z): runs just before 0173; creates all remaining platform
      # tables (org_invitations, notification_digest_queue,
      # platform_metrics_snapshots, super_admins); pre-adds org_id columns and
      # creates indexes NON-concurrently on app tables so that 0173's
      # CREATE INDEX CONCURRENTLY IF NOT EXISTS statements are silent no-ops
      # (CONCURRENTLY cannot run inside a transaction block, but IF NOT EXISTS
      # on a pre-existing index is always a no-op regardless).
      - name: Write e2e prereq migration stubs
        run: |
          # ── File 1: satisfies 0173 existence pre-checks ─────────────────────
          cat > supabase/migrations/0000_e2e_prereqs.sql << 'SQL'
          -- E2E CI prereq stub: satisfies organizations/org_members existence
          -- guards inside 0173_rls_isolation_hardening.sql.
          -- Generated at CI runtime. NOT committed to the repo.

          CREATE TABLE IF NOT EXISTS organizations (
            org_id    uuid        PRIMARY KEY DEFAULT gen_random_uuid(),
            name      text        NOT NULL    DEFAULT 'E2E Test Org',
            is_active boolean     NOT NULL    DEFAULT true
          );

          CREATE TABLE IF NOT EXISTS org_members (
            id         uuid        PRIMARY KEY DEFAULT gen_random_uuid(),
            org_id     uuid        NOT NULL REFERENCES organizations(org_id) ON DELETE CASCADE,
            user_id    uuid        NOT NULL,
            role       text        NOT NULL DEFAULT 'MEMBER',
            is_active  boolean     NOT NULL DEFAULT true,
            created_at timestamptz NOT NULL DEFAULT now()
          );

          -- Singular stub tables assumed pre-existing by rpc_approve_quotation
          -- inside 0172_jobs_quotations_invoices.sql.  That function references
          -- bare names: quotation%ROWTYPE, FROM quotation, FROM invoice,
          -- UPDATE quotation, INSERT INTO invoice, UPDATE job.
          -- In production these tables exist from migrations 0001–0171 (not
          -- present in CI).  We stub them here so 0172 can compile cleanly.
          -- NOTE: enum types quotation_status / job_status are created INSIDE
          -- 0172, so status columns must use TEXT to avoid a circular dependency.

          CREATE TABLE IF NOT EXISTS quotation (
            quotation_id  uuid          PRIMARY KEY DEFAULT gen_random_uuid(),
            status        text          NOT NULL DEFAULT 'draft',
            job_id        uuid,
            customer_id   uuid          NOT NULL DEFAULT gen_random_uuid(),
            subtotal      numeric(12,2) NOT NULL DEFAULT 0,
            vat_rate      numeric(5,4)  NOT NULL DEFAULT 0,
            vat_amount    numeric(12,2) NOT NULL DEFAULT 0,
            discount      numeric(12,2) NOT NULL DEFAULT 0,
            total         numeric(12,2) NOT NULL DEFAULT 0,
            approved_at   timestamptz,
            approved_by   uuid,
            updated_at    timestamptz   NOT NULL DEFAULT now()
          );

          CREATE TABLE IF NOT EXISTS invoice (
            invoice_id    uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            invoice_code  text NOT NULL DEFAULT ''
          );

          CREATE TABLE IF NOT EXISTS job (
            job_id        uuid        PRIMARY KEY DEFAULT gen_random_uuid(),
            status        text        NOT NULL DEFAULT 'open',
            quotation_id  uuid,
            invoice_id    uuid,
            updated_at    timestamptz NOT NULL DEFAULT now()
          );
          SQL

          # ── File 2: satisfies all remaining 0173 prerequisites ──────────────
          cat > supabase/migrations/0172_z_e2e_platform_stub.sql << 'SQL'
          -- E2E CI platform stub: provides all prerequisites for
          -- 0173_rls_isolation_hardening.sql that come from the production
          -- multi-tenant bootstrap script (not part of the numbered sequence).
          -- Generated at CI runtime. NOT committed to the repo.

          -- ── Clear the 0172 migration record so Supabase CLI can insert it ──
          -- Both 0172_jobs_quotations_invoices.sql and this file share the same
          -- leading numeric version (0172). The CLI records the version after
          -- running each file; if the record already exists the INSERT fails.
          -- Deleting it here lets the CLI re-insert for this file, which is
          -- safe in CI because every run starts from a fresh container.
          DELETE FROM supabase_migrations.schema_migrations WHERE version = '0172';

          -- ── Missing platform tables ─────────────────────────────────────────
          CREATE TABLE IF NOT EXISTS org_invitations (
            id     uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            email  text NOT NULL    DEFAULT '',
            org_id uuid NOT NULL    REFERENCES organizations(org_id) ON DELETE CASCADE
          );

          CREATE TABLE IF NOT EXISTS notification_digest_queue (
            id      uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id uuid NOT NULL
          );

          CREATE TABLE IF NOT EXISTS platform_metrics_snapshots (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid()
          );

          CREATE TABLE IF NOT EXISTS super_admins (
            id      uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id uuid NOT NULL
          );

          -- ── get_user_org_id stub (called by rpc_job_board in 0173) ──────────
          CREATE OR REPLACE FUNCTION public.get_user_org_id()
          RETURNS uuid LANGUAGE sql SECURITY DEFINER SET search_path = public AS $$
            SELECT org_id FROM public.org_members
             WHERE user_id = auth.uid() AND is_active = true
             LIMIT 1;
          $$;

          -- ── Pre-add org_id to app tables and create indexes ─────────────────
          -- Wrapped per-table so a missing table (prior migration failure) is skipped.
          -- The CREATE INDEX IF NOT EXISTS (non-concurrent) means that when 0173 runs
          -- CREATE INDEX CONCURRENTLY IF NOT EXISTS the index already exists → no-op.
          DO $do$
          BEGIN
            IF EXISTS (SELECT 1 FROM information_schema.tables
                       WHERE table_schema='public' AND table_name='customer') THEN
              ALTER TABLE customer ADD COLUMN IF NOT EXISTS org_id uuid;
              CREATE INDEX IF NOT EXISTS idx_customer_org ON customer(org_id);
            END IF;
          END $do$;

          DO $do$
          BEGIN
            IF EXISTS (SELECT 1 FROM information_schema.tables
                       WHERE table_schema='public' AND table_name='job') THEN
              ALTER TABLE job ADD COLUMN IF NOT EXISTS org_id uuid;
              CREATE INDEX IF NOT EXISTS idx_job_org ON job(org_id);
            END IF;
          END $do$;

          DO $do$
          BEGIN
            IF EXISTS (SELECT 1 FROM information_schema.tables
                       WHERE table_schema='public' AND table_name='job_panel') THEN
              ALTER TABLE job_panel ADD COLUMN IF NOT EXISTS org_id uuid;
              CREATE INDEX IF NOT EXISTS idx_job_panel_org ON job_panel(org_id);
            END IF;
          END $do$;

          DO $do$
          BEGIN
            IF EXISTS (SELECT 1 FROM information_schema.tables
                       WHERE table_schema='public' AND table_name='quotation') THEN
              ALTER TABLE quotation ADD COLUMN IF NOT EXISTS org_id uuid;
              CREATE INDEX IF NOT EXISTS idx_quotation_org ON quotation(org_id);
            END IF;
          END $do$;

          DO $do$
          BEGIN
            IF EXISTS (SELECT 1 FROM information_schema.tables
                       WHERE table_schema='public' AND table_name='quotation_line') THEN
              ALTER TABLE quotation_line ADD COLUMN IF NOT EXISTS org_id uuid;
              CREATE INDEX IF NOT EXISTS idx_quotation_line_org ON quotation_line(org_id);
            END IF;
          END $do$;

          DO $do$
          BEGIN
            IF EXISTS (SELECT 1 FROM information_schema.tables
                       WHERE table_schema='public' AND table_name='invoice') THEN
              ALTER TABLE invoice ADD COLUMN IF NOT EXISTS org_id uuid;
              CREATE INDEX IF NOT EXISTS idx_invoice_org ON invoice(org_id);
            END IF;
          END $do$;

          DO $do$
          BEGIN
            IF EXISTS (SELECT 1 FROM information_schema.tables
                       WHERE table_schema='public' AND table_name='invoice_payment') THEN
              ALTER TABLE invoice_payment ADD COLUMN IF NOT EXISTS org_id uuid;
              CREATE INDEX IF NOT EXISTS idx_invoice_payment_org ON invoice_payment(org_id);
            END IF;
          END $do$;

          -- ── Ensure job + invoice are in supabase_realtime publication ────────
          -- 0173 DROPs them from the publication; they must be members first.
          DO $do$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_publication_tables
                           WHERE pubname='supabase_realtime'
                             AND schemaname='public' AND tablename='job')
            AND EXISTS (SELECT 1 FROM information_schema.tables
                        WHERE table_schema='public' AND table_name='job') THEN
              EXECUTE 'ALTER PUBLICATION supabase_realtime ADD TABLE public.job';
            END IF;
          END $do$;

          DO $do$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_publication_tables
                           WHERE pubname='supabase_realtime'
                             AND schemaname='public' AND tablename='invoice')
            AND EXISTS (SELECT 1 FROM information_schema.tables
                        WHERE table_schema='public' AND table_name='invoice') THEN
              EXECUTE 'ALTER PUBLICATION supabase_realtime ADD TABLE public.invoice';
            END IF;
          END $do$;
          SQL

      # ── Restore Supabase Docker image cache ────────────────────────────────
      # Cache key: SHA of supabase/config.toml (Supabase version pin).
      # Cache path: /tmp/supabase-images — saved as a single tar after first pull.
      - name: Restore Supabase Docker image cache
        id: cache-supabase-images
        uses: actions/cache@v4
        with:
          path: /tmp/supabase-images
          key: supabase-images-${{ hashFiles('supabase/config.toml') }}

      # Load pre-pulled images on cache hit — skips the Docker pull entirely
      - name: Load Supabase images from cache
        if: steps.cache-supabase-images.outputs.cache-hit == 'true'
        run: docker load --input /tmp/supabase-images/supabase-images.tar

      # ── Start local Supabase stack (Docker available on ubuntu-latest) ─────
      # supabase start auto-applies every .sql file in supabase/migrations/
      # in lexicographic order:
      #   0000_e2e_prereqs → 0001...0172 → 0172_z_e2e_platform_stub → 0173 → ... → 0215
      - name: Start local Supabase
        run: supabase start

      # Save Supabase images to cache after a cold pull (cache miss only)
      - name: Save Supabase images to cache
        if: steps.cache-supabase-images.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/supabase-images
          docker save \
            $(docker images --format '{{.Repository}}:{{.Tag}}' \
              | grep -E 'supabase|postgres' \
              | grep -v '<none>') \
            --output /tmp/supabase-images/supabase-images.tar

      # ── Extract local API credentials from `supabase status` ──────────────
      - name: Export local Supabase credentials
        id: supabase_local
        run: |
          STATUS=$(supabase status 2>/dev/null)

          LOCAL_URL=$(echo "$STATUS"     | grep -E "^API URL"       | awk '{print $NF}')
          LOCAL_ANON=$(echo "$STATUS"    | grep -E "^anon key"      | awk '{print $NF}')
          LOCAL_SVC=$(echo "$STATUS"     | grep -E "^service_role"  | awk '{print $NF}')
          LOCAL_JWT=$(echo "$STATUS"     | grep -E "^JWT secret"    | awk '{print $NF}')

          # Fallback to well-known local defaults when grep finds nothing
          LOCAL_URL="${LOCAL_URL:-http://localhost:54321}"
          LOCAL_JWT="${LOCAL_JWT:-super-secret-jwt-token-with-at-least-32-characters-long}"

          echo "local_url=$LOCAL_URL"       >> "$GITHUB_OUTPUT"
          echo "local_anon_key=$LOCAL_ANON" >> "$GITHUB_OUTPUT"
          echo "local_svc_key=$LOCAL_SVC"   >> "$GITHUB_OUTPUT"
          echo "local_jwt=$LOCAL_JWT"       >> "$GITHUB_OUTPUT"

      # ── Run E2E smoke tests ────────────────────────────────────────────────
      - name: E2E smoke — submit → approve → purchased → receive → close
        run: |
          deno test \
            --allow-env \
            --allow-net \
            --no-check \
            --reporter=pretty \
            supabase/tests/e2e_smoke_test.ts
        env:
          SUPABASE_URL:              ${{ steps.supabase_local.outputs.local_url }}
          SUPABASE_ANON_KEY:         ${{ steps.supabase_local.outputs.local_anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase_local.outputs.local_svc_key }}
          SUPABASE_JWT_SECRET:       ${{ steps.supabase_local.outputs.local_jwt }}
          # LINE API calls in smoke test are no-op locally (no real token)
          LINE_FPR_CHANNEL_ACCESS_TOKEN: "local-test-placeholder"
          LINE_CHANNEL_ACCESS_TOKEN:     "local-test-placeholder"
          LINE_API_BASE:                 "http://localhost:54321"
          VERTICAL:                      "field_purchase"

      # ── Always stop local stack to free runner ports ───────────────────────
      - name: Stop local Supabase
        if: always()
        run: supabase stop
