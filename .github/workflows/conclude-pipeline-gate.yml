name: Conclude Pipeline Gate

# ──────────────────────────────────────────────────────────────────────────────
# Reusable workflow: conclude-pipeline-gate
#
# Posts a PR comment with the pipeline gate result table (including SARIF delta),
# creates a `ci/pipeline-gate` commit status, and sends a Slack alert on failure.
#
# Callers pass pre-computed gate values (overall_status, critical_failed_jobs,
# SARIF counts) and the token/secrets they want used.  The workflow is designed
# to be called from the very end of any CI pipeline that wants a unified gate.
#
# Minimal usage example:
#
#   use-pipeline-gate:
#     needs: [lint, tests, upload-eslint-sarif]
#     uses: ./.github/workflows/conclude-pipeline-gate.yml
#     with:
#       overall_status:          ${{ needs.upload-eslint-sarif.result == 'failure' && 'failure' || 'success' }}
#       critical_failed_jobs:    ${{ join(fromJSON('["lint","tests"]'), ',') }}
#       sarif_new_findings:      ${{ fromJSON(needs.upload-eslint-sarif.outputs.new-findings || '0') }}
#       sarif_total_findings:    ${{ fromJSON(needs.upload-eslint-sarif.outputs.total-findings || '0') }}
#       sarif_suppressed_findings: ${{ fromJSON(needs.upload-eslint-sarif.outputs.suppressed-findings || '0') }}
#       sarif_threshold:         10
#       commit_sha:              ${{ github.event.pull_request.head.sha || github.sha }}
#       run_url:                 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
#       run_number:              ${{ github.run_number }}
#       repository:              ${{ github.repository }}
#       ref_name:                ${{ github.ref_name }}
#       actor:                   ${{ github.actor }}
#       pr_number:               ${{ github.event.pull_request.number || 0 }}
#     secrets:
#       GATE_TOKEN:              ${{ secrets.GITHUB_TOKEN }}
#       SLACK_WEBHOOK_URL:       ${{ secrets.SLACK_WEBHOOK_URL }}
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      overall_status:
        description: 'Pre-computed overall pipeline status for manual test runs'
        required: false
        default: 'success'
        type: choice
        options:
          - success
          - failure
      sarif_threshold:
        description: 'SARIF critical threshold override (numeric string, default 10)'
        required: false
        default: '10'
        type: string
      skip_gate:
        description: 'Dry-run mode - post advisory success status only'
        required: false
        default: false
        type: boolean
      commit_sha:
        description: 'Full SHA to post commit status on (leave blank to skip status)'
        required: false
        default: ''
        type: string
      run_url:
        description: 'Full URL of the triggering run (shown in comment / Slack)'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:

      # ── Gate result ─────────────────────────────────────────────────────────
      overall_status:
        description: 'Pre-computed overall pipeline status (success | failure)'
        required: true
        type: string

      critical_failed_jobs:
        description: 'Comma-separated IDs of failed critical jobs (empty = none)'
        required: false
        type: string
        default: ''

      # ── SARIF metrics ────────────────────────────────────────────────────────
      sarif_new_findings:
        description: 'Count of new SARIF findings vs baseline'
        required: false
        type: number
        default: 0

      sarif_total_findings:
        description: 'Total current SARIF findings'
        required: false
        type: number
        default: 0

      sarif_suppressed_findings:
        description: 'Count of suppressed/resolved SARIF findings vs baseline'
        required: false
        type: number
        default: 0

      sarif_threshold:
        description: 'SARIF critical threshold — findings above this mark as breached'
        required: false
        type: number
        default: 10

      # ── Dry-run / advisory mode ───────────────────────────────────────────────
      skip_gate:
        description: >
          When true, posts a success commit status with an advisory note and
          suppresses core.setFailed.  Useful for dry-run / manual workflow_dispatch
          executions where the gate should be informational only.
        required: false
        type: boolean
        default: false

      # ── GitHub context (needed for PR comment + commit status) ───────────────
      pr_number:
        description: 'Pull request number (pass 0 or omit when not a PR event)'
        required: false
        type: number
        default: 0

      commit_sha:
        description: 'Full SHA of the commit to post the status on'
        required: true
        type: string

      run_url:
        description: 'Full URL of the calling workflow run (for links in comment / Slack)'
        required: true
        type: string

      run_number:
        description: 'Workflow run number (shown in comment / Slack message)'
        required: false
        type: number
        default: 0

      repository:
        description: 'owner/repo of the calling workflow (for Slack message + jobs API)'
        required: false
        type: string
        default: ''

      ref_name:
        description: 'Branch or ref name (shown in Slack message)'
        required: false
        type: string
        default: ''

      actor:
        description: 'GitHub actor who triggered the workflow (shown in Slack message)'
        required: false
        type: string
        default: ''

    secrets:
      GATE_TOKEN:
        description: >
          GitHub token with pull-requests:write + statuses:write.
          Pass secrets.GITHUB_TOKEN from the calling workflow.
        required: true
      SLACK_WEBHOOK_URL:
        description: 'Slack incoming webhook URL (optional — Slack step is skipped if absent)'
        required: false
      SLACK_CHANNEL_OVERRIDE:
        description: 'Override the default Slack channel (optional)'
        required: false

    outputs:
      overall_status:
        description: 'The overall_status input echoed back for chaining'
        value: ${{ jobs.post-pipeline-gate.outputs.overall_status }}
      sarif_breached:
        description: 'true if sarifNewFindings exceeded sarifThreshold, else false'
        value: ${{ jobs.post-pipeline-gate.outputs.sarif_breached }}
      validation_passed:
        description: 'true if validate-inputs passed all schema checks, else false'
        value: ${{ jobs.validate-inputs.outputs.validation_passed }}

# ──────────────────────────────────────────────────────────────────────────────
jobs:
  validate-inputs:
    name: Validate Caller Inputs
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_call'
    outputs:
      validation_passed: ${{ steps.schema-check.outputs.validation_passed }}
      validation_errors:  ${{ steps.schema-check.outputs.validation_errors }}
    steps:
      - name: Schema-check workflow_call inputs
        id: schema-check
        uses: actions/github-script@v7
        env:
          OVERALL_STATUS:    ${{ inputs.overall_status }}
          COMMIT_SHA:        ${{ inputs.commit_sha }}
          RUN_URL:           ${{ inputs.run_url }}
          SARIF_NEW:         ${{ inputs.sarif_new_findings }}
          SARIF_TOTAL:       ${{ inputs.sarif_total_findings }}
          SARIF_SUPPRESSED:  ${{ inputs.sarif_suppressed_findings }}
          SARIF_THRESHOLD:   ${{ inputs.sarif_threshold }}
          PR_NUMBER:         ${{ inputs.pr_number }}
          RUN_NUMBER:        ${{ inputs.run_number }}
          CRITICAL_FAILED_JOBS: ${{ inputs.critical_failed_jobs }}
        with:
          script: |
            const errors = [];

            // overall_status: required; must be a known status string
            const VALID_STATUSES = ['success', 'failure', 'cancelled', 'skipped', 'neutral'];
            const overallStatus  = process.env.OVERALL_STATUS || '';
            if (!VALID_STATUSES.includes(overallStatus))
              errors.push(
                `overall_status '${overallStatus}' is invalid — expected one of: ${VALID_STATUSES.join(', ')}`
              );

            // commit_sha: required; must be a 40-char hex SHA-1
            const commitSha = process.env.COMMIT_SHA || '';
            if (!/^[0-9a-f]{40}$/i.test(commitSha))
              errors.push(
                `commit_sha '${commitSha.slice(0, 12)}...' is not a valid SHA-1 (expected 40 hex chars)`
              );

            // run_url: required; must be an https:// URL
            const runUrl = process.env.RUN_URL || '';
            if (!runUrl.startsWith('https://'))
              errors.push(`run_url must start with 'https://'; got '${runUrl.slice(0, 40)}'`);

            // numeric inputs: must parse as integers >= minVal
            const numChecks = [
              ['sarif_new_findings',        process.env.SARIF_NEW,       0],
              ['sarif_total_findings',      process.env.SARIF_TOTAL,     0],
              ['sarif_suppressed_findings', process.env.SARIF_SUPPRESSED,0],
              ['sarif_threshold',           process.env.SARIF_THRESHOLD, 1],
              ['pr_number',                 process.env.PR_NUMBER,       0],
              ['run_number',                process.env.RUN_NUMBER,      0],
            ];
            for (const [name, raw, minVal] of numChecks) {
              const val = parseInt(raw || '0', 10);
              if (isNaN(val) || val < minVal)
                errors.push(`${name} must be an integer >= ${minVal}; got '${raw}'`);
            }

            // critical_failed_jobs allowlist check
            const KNOWN_JOB_IDS = [
              'lint', 'integration-tests', 'feature-cache-coverage', 'post-coverage-badge',
              'e2e-backend-gate', 'notify-slack-on-failure', 'notify-slack-on-success',
              'notify-coverage-badge-failure', 'create-webhook-broken-label',
              'notify-success-pipeline-failure', 'post-workflow-summary', 'upload-eslint-sarif',
              'close-webhook-broken-issue', 'notify-slack-on-sarif-findings',
              'notify-slack-on-sarif-critical', 'open-sarif-findings-issue',
              'close-sarif-findings-issue', 'block-merge-on-sarif-critical',
              'post-sarif-pr-description', 'dry-run-summary', 'workflow-run-step-summary',
              'pr-job-conclusion-diff', 'conclude-pipeline', 'run-pipeline-gate',
            ];
            const criticalFailedRaw = (process.env.CRITICAL_FAILED_JOBS || '')
              .split(',').map(s => s.trim()).filter(Boolean);
            for (const jobId of criticalFailedRaw) {
              if (!KNOWN_JOB_IDS.includes(jobId))
                errors.push(
                  `critical_failed_jobs contains unknown job ID: '${jobId}' — ` +
                  `must be one of: ${KNOWN_JOB_IDS.join(', ')}`
                );
            }

            // Cross-validate: non-empty critical_failed_jobs must imply overall_status='failure'
            if (criticalFailedRaw.length > 0 && overallStatus !== 'failure') {
              errors.push(
                `overall_status is '${overallStatus}' but critical_failed_jobs is non-empty ` +
                `(${criticalFailedRaw.join(', ')}) — expected overall_status to be 'failure'`
              );
            }

            // Cross-validate (reverse): overall_status='failure' requires at least one entry in critical_failed_jobs
            if (overallStatus === 'failure' && criticalFailedRaw.length === 0) {
              errors.push(
                `overall_status is 'failure' but critical_failed_jobs is empty — expected at least one failing job ID when overall_status is 'failure'`
              );
            }

            if (errors.length > 0) {
              errors.forEach(msg => core.error(msg));
              core.setOutput('validation_passed', 'false');
              core.setOutput('validation_errors', JSON.stringify(errors));
              core.setFailed(
                `conclude-pipeline-gate: ${errors.length} input validation error(s) — see above`
              );
            } else {
              core.setOutput('validation_passed', 'true');
              core.setOutput('validation_errors', '[]');
              core.info(
                `All inputs valid — overall_status=${overallStatus}, ` +
                `sha=${commitSha.slice(0, 7)}, sarif_threshold=${process.env.SARIF_THRESHOLD}`
              );
            }

      - name: Post validation badge PR comment
        id: badge-comment
        if: always() && inputs.pr_number != ''
        uses: actions/github-script@v7
        env:
          VALIDATION_PASSED: ${{ steps.schema-check.outputs.validation_passed }}
          VALIDATION_ERRORS: ${{ steps.schema-check.outputs.validation_errors }}
          PR_NUMBER:         ${{ inputs.pr_number }}
          RUN_URL:           ${{ inputs.run_url }}
        with:
          script: |
            const passed      = process.env.VALIDATION_PASSED === 'true';
            const errorsJson  = process.env.VALIDATION_ERRORS || '[]';
            let parsedErrors  = [];
            try { parsedErrors = JSON.parse(errorsJson); } catch (_) {}
            const prNumber    = parseInt(process.env.PR_NUMBER || '0', 10);
            const runUrl      = process.env.RUN_URL || '';
            if (!prNumber) { core.info('No valid PR number \u2014 skipping badge comment'); return; }
            const icon  = passed ? '\u2705' : '\u274c';
            const label = passed ? '**passed**' : '**failed**';
            const parts = [
              `<!-- conclude-pipeline-gate-validation -->`,
              `### ${icon} Gate Schema Validation \u2014 ${label}`,
              ``,
            ];
            if (passed) {
              parts.push('All `conclude-pipeline-gate` inputs passed schema validation for this run.');
            } else {
              parts.push(`\u26a0\ufe0f Schema validation failed \u2014 ${parsedErrors.length} error(s):`);
              parts.push('');
              parts.push('| # | Error |');
              parts.push('|---|-------|');
              parsedErrors.forEach((e, i) => parts.push(`| ${i + 1} | ${e} |`));
            }
            parts.push('');
            parts.push(`_Updated by \`validate-inputs\` \u00b7 [View run](${runUrl})_`);
            const body   = parts.join('\n');
            const MARKER = '<!-- conclude-pipeline-gate-validation -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
              core.info(`Updated validation badge comment #${existing.id} on PR #${prNumber}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, body,
              });
              core.info(`Created validation badge comment on PR #${prNumber}`);
            }

      - name: Post commit status for schema validation
        id: post-validation-status
        if: always() && inputs.commit_sha != ''
        uses: actions/github-script@v7
        env:
          VALIDATION_PASSED: ${{ steps.schema-check.outputs.validation_passed }}
          COMMIT_SHA:        ${{ inputs.commit_sha }}
          RUN_URL:           ${{ inputs.run_url }}
        with:
          script: |
            const passed    = process.env.VALIDATION_PASSED === 'true';
            const commitSha = process.env.COMMIT_SHA || '';
            const runUrl    = process.env.RUN_URL || '';
            if (!commitSha || commitSha.length < 40) {
              core.warning('commit_sha invalid \u2014 skipping commit status post');
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              sha:         commitSha,
              state:       passed ? 'success' : 'failure',
              target_url:  runUrl,
              context:     'ci/validate-inputs-schema',
              description: passed
                ? 'All gate inputs passed schema validation'
                : 'One or more gate inputs failed schema validation',
            });
            core.info(
              `Posted ci/validate-inputs-schema=${
                passed ? 'success' : 'failure'
              } on ${commitSha.slice(0, 7)}`
            );

  post-pipeline-gate:
    name: Post Pipeline Gate
    needs: [validate-inputs, smoke-test-validate-inputs]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && github.event_name == 'workflow_call' && needs.smoke-test-validate-inputs.result == 'success'

    permissions:
      pull-requests: write
      statuses:      write

    outputs:
      overall_status: ${{ steps.gate.outputs.overall_status }}
      sarif_breached: ${{ steps.gate.outputs.sarif_breached }}

    steps:
      # ── Step 1: Post PR comment + commit status ──────────────────────────────
      - name: Post PR comment and commit status
        id: gate
        uses: actions/github-script@v7
        env:
          OVERALL_STATUS:        ${{ inputs.overall_status }}
          CRITICAL_FAILED_JOBS:  ${{ inputs.critical_failed_jobs }}
          SARIF_NEW_FINDINGS:    ${{ inputs.sarif_new_findings }}
          SARIF_TOTAL_FINDINGS:  ${{ inputs.sarif_total_findings }}
          SARIF_SUPPRESSED:      ${{ inputs.sarif_suppressed_findings }}
          SARIF_THRESHOLD:       ${{ inputs.sarif_threshold }}
          SKIP_GATE:             ${{ inputs.skip_gate }}
          PR_NUMBER:             ${{ inputs.pr_number }}
          COMMIT_SHA:            ${{ inputs.commit_sha }}
          RUN_URL:               ${{ inputs.run_url }}
          RUN_NUMBER:            ${{ inputs.run_number }}
          VALIDATION_PASSED:     ${{ needs.validate-inputs.outputs.validation_passed }}
        with:
          github-token: ${{ secrets.GATE_TOKEN }}
          script: |
            // ── Validation guard ─────────────────────────────────────────────────
            // If schema validation failed, post an advisory neutral commit status
            // and return early instead of running gate logic with bad inputs.
            const validationPassed = process.env.VALIDATION_PASSED;
            if (validationPassed !== 'true') {
              core.warning(
                'Schema validation failed — posting advisory neutral commit status and skipping gate logic.'
              );
              const earlyCommitSha = process.env.COMMIT_SHA || '';
              if (/^[0-9a-f]{40}$/i.test(earlyCommitSha)) {
                await github.rest.repos.createCommitStatus({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  sha:         earlyCommitSha,
                  state:       'success',
                  context:     'ci/pipeline-gate',
                  description: 'Advisory: schema validation failed — check validate-inputs logs.',
                  target_url:  process.env.RUN_URL || '',
                });
                core.info(`Advisory commit status posted for ${earlyCommitSha.slice(0, 7)}.`);
              }
              return;
            }

            // ── Parse inputs ────────────────────────────────────────────────────
            const overallStatus   = process.env.OVERALL_STATUS   || 'failure';
            const criticalFailed  = (process.env.CRITICAL_FAILED_JOBS || '')
              .split(',').map(s => s.trim()).filter(Boolean);
            const sarifNew        = parseInt(process.env.SARIF_NEW_FINDINGS   || '0', 10);
            const sarifTotal      = parseInt(process.env.SARIF_TOTAL_FINDINGS  || '0', 10);
            const sarifSuppressed = parseInt(process.env.SARIF_SUPPRESSED      || '0', 10);
            const sarifUnchanged  = Math.max(0, sarifTotal - sarifNew);
            const sarifThreshold  = parseInt(process.env.SARIF_THRESHOLD       || '10', 10);
            const sarifBreached   = sarifNew > sarifThreshold;
            const skipGate        = process.env.SKIP_GATE === 'true';
            const prNumber        = parseInt(process.env.PR_NUMBER  || '0', 10);
            const commitSha       = process.env.COMMIT_SHA;
            const runUrl          = process.env.RUN_URL    || '';
            const runNumber       = process.env.RUN_NUMBER || '?';

            // ── Helpers ──────────────────────────────────────────────────────────
            function icon(status) {
              if (status === 'success')   return '✅';
              if (status === 'failure')   return '❌';
              if (status === 'skipped')   return '⏭️';
              if (status === 'cancelled') return '🚫';
              return '❓';
            }

            const overallLabel = `${icon(overallStatus)} ${overallStatus === 'success' ? 'Passed' : 'Failed'}`;
            const summary = criticalFailed.length > 0
              ? `Critical jobs failed: ${criticalFailed.map(j => `\`${j}\``).join(', ')}`
              : 'All critical jobs passed.';

            // ── SARIF metrics row + delta section ────────────────────────────────
            const sarifLine    = `| SARIF new findings | ${sarifBreached ? '❌' : '✅'} ${sarifNew} _(threshold: ${sarifThreshold})_ |`;
            const deltaSection = [
              '### SARIF Delta',
              '',
              '| Metric | Count |',
              '|--------|-------|',
              `| ➕ Added (new)        | ${sarifNew} |`,
              `| ➖ Removed (resolved) | ${sarifSuppressed} |`,
              `| ✅ Unchanged          | ${sarifUnchanged} |`,
              `| 📊 Total              | ${sarifTotal} |`,
              '',
            ];

            // ── Failed critical jobs list ─────────────────────────────────────────
            const failedRows = criticalFailed.length > 0
              ? criticalFailed.map(j => `| \`${j}\` | ❌ failure _(critical)_ |`).join('\n')
              : '_None_';

            // ── Build body ────────────────────────────────────────────────────────
            const marker    = '<!-- conclude-pipeline-gate -->';
            const bodyParts = [
              '## Pipeline Gate',
              '',
              `**Overall: ${overallLabel}** — ${summary}`,
              '',
              '| Metric | Value |',
              '|--------|-------|',
              sarifLine,
              '',
              ...deltaSection,
              criticalFailed.length > 0 ? '### Failed Critical Jobs' : '',
              criticalFailed.length > 0 ? '' : '',
              criticalFailed.length > 0 ? '| Job | Result |' : '',
              criticalFailed.length > 0 ? '|-----|--------|' : '',
              criticalFailed.length > 0 ? failedRows : '',
              '',
            ].filter(l => l !== undefined);
            if (skipGate) bodyParts.push('_⚠️ Dry-run mode: gate is advisory only._', '');
            bodyParts.push(`<sub>[View run](${runUrl}) · Run \`#${runNumber}\`</sub>`);
            const body = bodyParts.join('\n');

            // ── Write status file for downstream Slack step ──────────────────────
            const fs = require('fs');
            fs.writeFileSync('/tmp/gate-status.json', JSON.stringify({
              overallStatus,
              criticalFailed,
              sarifNew,
              sarifThreshold,
              sarifBreached,
              runUrl,
            }));

            // ── Post/update PR comment ───────────────────────────────────────────
            if (prNumber > 0) {
              const { data: comments } = await github.rest.issues.listComments({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: prNumber,
              });
              const existing = comments.find(
                c => c.user.login === 'github-actions[bot]' && c.body.includes(marker)
              );
              const fullBody = marker + '\n' + body;
              if (existing) {
                await github.rest.issues.updateComment({
                  owner:      context.repo.owner,
                  repo:       context.repo.repo,
                  comment_id: existing.id,
                  body:       fullBody,
                });
                core.info(`Updated pipeline gate comment ${existing.id}`);
              } else {
                await github.rest.issues.createComment({
                  owner:        context.repo.owner,
                  repo:         context.repo.repo,
                  issue_number: prNumber,
                  body:         fullBody,
                });
                core.info('Created pipeline gate comment.');
              }
            }

            // ── Create commit status ─────────────────────────────────────────────
            const statusState = skipGate ? 'success' : overallStatus;
            const statusDesc  = skipGate
              ? 'Dry-run mode — gate is advisory.'
              : summary.slice(0, 140);
            await github.rest.repos.createCommitStatus({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              sha:         commitSha,
              state:       statusState,
              context:     'ci/pipeline-gate',
              description: statusDesc,
              target_url:  runUrl,
            });
            core.info(`Commit status '${statusState}' posted for ${commitSha.slice(0, 7)}`);

            // ── Propagate outputs ────────────────────────────────────────────────
            core.setOutput('overall_status', overallStatus);
            core.setOutput('sarif_breached', String(sarifBreached));

            // ── Fail the job if gate is not advisory ─────────────────────────────
            if (overallStatus === 'failure' && !skipGate) {
              core.setFailed(`Pipeline gate failed — critical jobs: ${criticalFailed.join(', ')}`);
            }

      # ── Step 2: Slack alert on pipeline failure ──────────────────────────────
      - name: Notify Slack on pipeline failure
        if: always()
        env:
          SLACK_WEBHOOK_URL:      ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL_OVERRIDE: ${{ secrets.SLACK_CHANNEL_OVERRIDE }}
          GITHUB_TOKEN:           ${{ secrets.GATE_TOKEN }}
          RUN_URL:                ${{ inputs.run_url }}
          REPOSITORY:             ${{ inputs.repository }}
          REF_NAME:               ${{ inputs.ref_name }}
          ACTOR:                  ${{ inputs.actor }}
          RUN_NUMBER:             ${{ inputs.run_number }}
        run: |
          python3 - <<'PYSLACK_GATE'
          import json, os, sys, urllib.request

          status_file = '/tmp/gate-status.json'
          if not os.path.exists(status_file):
              print('No gate-status.json found — skipping Slack notify.')
              sys.exit(0)

          with open(status_file) as f:
              data = json.load(f)

          if data.get('overallStatus') != 'failure':
              print(f'overallStatus={data.get("overallStatus")} — nothing to notify.')
              sys.exit(0)

          webhook = os.environ.get('SLACK_WEBHOOK_URL', '').strip()
          if not webhook:
              print('SLACK_WEBHOOK_URL not set — skipping Slack notify.')
              sys.exit(0)

          channel        = os.environ.get('SLACK_CHANNEL_OVERRIDE', '').strip()
          run_url        = os.environ.get('RUN_URL',      '')
          repository     = os.environ.get('REPOSITORY',  '')
          ref_name       = os.environ.get('REF_NAME',    '')
          actor          = os.environ.get('ACTOR',       '')
          run_number     = os.environ.get('RUN_NUMBER',  '?')
          token          = os.environ.get('GITHUB_TOKEN', '')
          critical_jobs  = data.get('criticalFailed', [])
          sarif_count    = data.get('sarifNew',       0)
          sarif_threshold = data.get('sarifThreshold', 10)
          sarif_breached  = data.get('sarifBreached', False)

          # Fetch per-job log URLs from jobs API
          log_lines = []
          if token and repository and run_url:
              try:
                  parts  = run_url.rstrip('/').split('/')
                  run_id = parts[-1]
                  api_url = (
                      f'https://api.github.com/repos/{repository}'
                      f'/actions/runs/{run_id}/jobs?per_page=50'
                  )
                  req = urllib.request.Request(api_url, headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  })
                  with urllib.request.urlopen(req, timeout=10) as r:
                      jobs_data = json.loads(r.read())
                  job_map = {
                      j['name']: j.get('html_url', '')
                      for j in jobs_data.get('jobs', [])
                  }
                  for jid in critical_jobs:
                      url = job_map.get(jid, '')
                      log_lines.append(f'• `{jid}` — <{url}|logs>' if url else f'• `{jid}`')
              except Exception as e:
                  log_lines = [f'• `{j}`' for j in critical_jobs]
                  print(f'Jobs API error: {e}')
          else:
              log_lines = [f'• `{j}`' for j in critical_jobs]

          sarif_note = (
              f'\n>:bar_chart: SARIF: `{sarif_count}` new findings'
              + (' \u274c threshold exceeded' if sarif_breached else '')
          ) if sarif_count else ''

          text = (
              ':rotating_light: *Pipeline Gate Failed*'
              f' \u2014 `{repository}` run `#{run_number}` on `{ref_name}`\n'
              f'>*Actor:* {actor}\n'
              f'>*Failed critical jobs:*\n'
              + '\n'.join(f'>{l}' for l in log_lines)
              + sarif_note
              + f'\n><{run_url}|View full run>'
          )

          payload = {'text': text}
          if channel:
              payload['channel'] = channel

          req2 = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode(),
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(req2, timeout=15) as resp:
                  print(f'Slack notified: {resp.status}')
          except Exception as e:
              print(f'Slack notify failed: {e}')
              sys.exit(1)
          PYSLACK_GATE

  # ── Smoke-test: validate-inputs must reject these malformed payloads ─────────
  # Runs on every trigger.  Each step exercises ONE validation rule in isolation
  # using the same logic as the live validate-inputs script.  The step PASSES
  # when the rule correctly detects an error (validation_passed would be 'false');
  # it calls core.setFailed (failing the job) only when validation unexpectedly
  # passes a bad payload.
  smoke-test-validate-inputs:
    name: "Smoke-test — validate-inputs rejects malformed payloads"
    runs-on: ubuntu-latest
    steps:
      - name: "TC-1: unknown job ID in critical_failed_jobs"
        id: tc1
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            // Payload: critical_failed_jobs contains IDs not in KNOWN_JOB_IDS.
            // Expected: allowlist errors produced → validation_passed='false'
            const KNOWN_JOB_IDS = [
              'lint', 'integration-tests', 'feature-cache-coverage', 'post-coverage-badge',
              'e2e-backend-gate', 'notify-slack-on-failure', 'notify-slack-on-success',
              'notify-coverage-badge-failure', 'create-webhook-broken-label',
              'notify-success-pipeline-failure', 'post-workflow-summary', 'upload-eslint-sarif',
              'close-webhook-broken-issue', 'notify-slack-on-sarif-findings',
              'notify-slack-on-sarif-critical', 'open-sarif-findings-issue',
              'close-sarif-findings-issue', 'block-merge-on-sarif-critical',
              'post-sarif-pr-description', 'dry-run-summary', 'workflow-run-step-summary',
              'pr-job-conclusion-diff', 'conclude-pipeline', 'run-pipeline-gate',
            ];
            const errors = [];
            const testPayload      = 'totally-unknown-job-xyz,another-bad-job';
            const criticalFailedRaw = testPayload.split(',').map(s => s.trim()).filter(Boolean);
            for (const jobId of criticalFailedRaw) {
              if (!KNOWN_JOB_IDS.includes(jobId))
                errors.push(`unknown job ID: '${jobId}'`);
            }
            if (errors.length === 0) {
              core.setFailed(
                'TC-1 FAILED: expected allowlist errors for unknown job IDs but got none ' +
                '(validate-inputs would have incorrectly set validation_passed=true)'
              );
            } else {
              core.info(`TC-1 PASSED — ${errors.length} error(s) detected: ${errors.join('; ')}`);
            }

      - name: "TC-2: overall_status/critical_failed_jobs mismatch"
        id: tc2
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            // Payload: critical_failed_jobs is non-empty but overall_status='success'
            // Expected: cross-validation error → validation_passed='false'
            const errors           = [];
            const overallStatus    = 'success';           // bad — should be 'failure'
            const criticalFailedRaw = ['lint', 'e2e-backend-gate'];
            if (criticalFailedRaw.length > 0 && overallStatus !== 'failure')
              errors.push(
                `overall_status='${overallStatus}' but critical_failed_jobs is non-empty ` +
                `(${criticalFailedRaw.join(', ')}) — expected 'failure'`
              );
            if (errors.length === 0) {
              core.setFailed(
                'TC-2 FAILED: expected cross-validation error (status/jobs mismatch) but got none ' +
                '(validate-inputs would have incorrectly set validation_passed=true)'
              );
            } else {
              core.info(`TC-2 PASSED — ${errors.length} error(s) detected: ${errors.join('; ')}`);
            }

      - name: "TC-3: invalid overall_status enum value"
        id: tc3
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            // Payload: overall_status is not one of the allowed enum values
            // Expected: invalid-status error → validation_passed='false'
            const VALID_STATUSES = ['success', 'failure', 'cancelled', 'skipped', 'neutral'];
            const errors         = [];
            const overallStatus  = 'maybe';               // bad — not a valid status
            if (!VALID_STATUSES.includes(overallStatus))
              errors.push(
                `overall_status '${overallStatus}' is invalid — ` +
                `expected one of: ${VALID_STATUSES.join(', ')}`
              );
            if (errors.length === 0) {
              core.setFailed(
                'TC-3 FAILED: expected invalid-status error for overall_status="maybe" but got none ' +
                '(validate-inputs would have incorrectly set validation_passed=true)'
              );
            } else {
              core.info(`TC-3 PASSED — ${errors.length} error(s) detected: ${errors.join('; ')}`);
            }

      - name: "TC-4: malformed commit_sha (not 40-char hex)"
        id: tc4
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            // Payload: commit_sha values that are not valid 40-char hex SHA-1 strings.
            // Expected: SHA-1 regex errors → validation_passed='false'
            const errors   = [];
            const testShas = [
              'deadbeef-not-40-hex',                         // invalid chars + wrong length
              'GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG',    // 40 chars but G is not hex
              'abc123',                                       // too short
            ];
            for (const sha of testShas) {
              if (!/^[0-9a-f]{40}$/i.test(sha))
                errors.push(`commit_sha '${sha.slice(0, 20)}...' is not a valid SHA-1`);
            }
            if (errors.length === 0) {
              core.setFailed(
                'TC-4 FAILED: expected SHA-1 validation errors for malformed commit_sha but got none ' +
                '(validate-inputs would have incorrectly set validation_passed=true)'
              );
            } else {
              core.info(`TC-4 PASSED — ${errors.length} error(s) detected: ${errors.join('; ')}`);
            }

      - name: "TC-5: critical_failed_jobs empty string with overall_status='failure'"
        id: tc5
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            // Payload: overall_status='failure' but critical_failed_jobs is empty string
            // Expected: reverse cross-validation error → validation_passed='false'
            const errors            = [];
            const overallStatus     = 'failure';   // bad — critical_failed_jobs must not be empty
            const criticalFailedRaw = ('').split(',').map(s => s.trim()).filter(Boolean);
            if (overallStatus === 'failure' && criticalFailedRaw.length === 0)
              errors.push(
                `overall_status is 'failure' but critical_failed_jobs is empty — ` +
                `expected at least one failing job ID when overall_status is 'failure'`
              );
            if (errors.length === 0) {
              core.setFailed(
                'TC-5 FAILED: expected reverse cross-validation error (failure + empty jobs) but got none ' +
                '(validate-inputs would have incorrectly set validation_passed=true)'
              );
            } else {
              core.info(`TC-5 PASSED — ${errors.length} error(s) detected: ${errors.join('; ')}`);
            }

      - name: "TC-6: overall_status='unknown' not in VALID_STATUSES"
        id: tc6
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            // Payload: overall_status='unknown' — not a member of VALID_STATUSES.
            // Expected: invalid-status error → validation_passed='false'
            const VALID_STATUSES = ['success', 'failure', 'cancelled', 'skipped', 'neutral'];
            const errors         = [];
            const overallStatus  = 'unknown';             // bad — not a valid status
            if (!VALID_STATUSES.includes(overallStatus))
              errors.push(
                `overall_status '${overallStatus}' is invalid — ` +
                `expected one of: ${VALID_STATUSES.join(', ')}`
              );
            if (errors.length === 0) {
              core.setFailed(
                'TC-6 FAILED: expected invalid-status error for overall_status="unknown" but got none ' +
                '(validate-inputs would have incorrectly set validation_passed=true)'
              );
            } else {
              core.info(`TC-6 PASSED — ${errors.length} error(s) detected: ${errors.join('; ')}`);
            }

      - name: "TC-7: run_url missing https:// prefix"
        id: tc7
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            // Payload: run_url values that do not start with 'https://'.
            // Expected: run_url validation error → validation_passed='false'
            const errors   = [];
            const testUrls = [
              'http://github.com/actions/run/123',   // wrong scheme
              '/relative/path/to/run',                // bare path
            ];
            for (const url of testUrls) {
              if (!url.startsWith('https://'))
                errors.push(`run_url must start with 'https://'; got '${url}'`);
            }
            if (errors.length === 0) {
              core.setFailed(
                'TC-7 FAILED: expected run_url validation errors but got none ' +
                '(validate-inputs would have incorrectly set validation_passed=true)'
              );
            } else {
              core.info(`TC-7 PASSED — ${errors.length} error(s) detected: ${errors.join('; ')}`);
            }

      - name: "Job summary — TC results table"
        if: always()
        env:
          TC1_OUTCOME: ${{ steps.tc1.outcome }}
          TC2_OUTCOME: ${{ steps.tc2.outcome }}
          TC3_OUTCOME: ${{ steps.tc3.outcome }}
          TC4_OUTCOME: ${{ steps.tc4.outcome }}
          TC5_OUTCOME: ${{ steps.tc5.outcome }}
          TC6_OUTCOME: ${{ steps.tc6.outcome }}
          TC7_OUTCOME: ${{ steps.tc7.outcome }}
        run: |
          tc() { [ "$1" = "success" ] && printf ':white_check_mark: PASS' || printf ':x: FAIL'; }
          {
            echo "## Smoke-test Results"
            echo ""
            echo "| # | Test Case | Validation Rule | Result |"
            echo "|---|-----------|-----------------|--------|"
            echo "| TC-1 | Unknown job ID in \`critical_failed_jobs\` | KNOWN_JOB_IDS allowlist | $(tc "$TC1_OUTCOME") |"
            echo "| TC-2 | \`overall_status\`/\`critical_failed_jobs\` mismatch | Cross-validation (forward) | $(tc "$TC2_OUTCOME") |"
            echo "| TC-3 | Invalid \`overall_status\` enum value | VALID_STATUSES enum | $(tc "$TC3_OUTCOME") |"
            echo "| TC-4 | Malformed \`commit_sha\` (not 40-char hex) | SHA-1 regex | $(tc "$TC4_OUTCOME") |"
            echo "| TC-5 | \`overall_status='failure'\` + empty \`critical_failed_jobs\` | Cross-validation (reverse) | $(tc "$TC5_OUTCOME") |"
            echo "| TC-6 | \`overall_status='unknown'\` not in VALID_STATUSES | VALID_STATUSES enum | $(tc \"$TC6_OUTCOME\") |"
            echo "| TC-7 | \`run_url\` missing \`https://\` prefix | run_url scheme check | $(tc \"$TC7_OUTCOME\") |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          # Fail job if any TC failed (continue-on-error masked the individual step failures)
          failed=0
          for outcome in "$TC1_OUTCOME" "$TC2_OUTCOME" "$TC3_OUTCOME" "$TC4_OUTCOME" "$TC5_OUTCOME" "$TC6_OUTCOME" "$TC7_OUTCOME"; do
            [ "$outcome" != "success" ] && failed=1
          done
          if [ "$failed" = "1" ]; then
            echo "::error::One or more smoke-test TCs failed — see job summary table above"
            echo "_⚠️ One or more TCs failed — check step logs._" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "_All 7 smoke-test TCs passed._" >> "$GITHUB_STEP_SUMMARY"
