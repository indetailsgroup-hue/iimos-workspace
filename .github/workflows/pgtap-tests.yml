name: pgTAP Tests

# =============================================================================
# REQUIRED SECRETS
# =============================================================================
# Secret name          | Where to get it                          | Scope
# ---------------------|------------------------------------------|------------------
# SUPABASE_ACCESS_TOKEN | app.supabase.com → Account → Access     | Repo secret
#                       | Tokens → "Generate new token"           | (all environments)
#
# HOW TO PROVISION (one-time per repo / environment):
#   GitHub UI:  Settings → Secrets and variables → Actions → New repository secret
#   GitHub CLI: gh secret set SUPABASE_ACCESS_TOKEN --body "<token>"
#
# The Supabase CLI uses this token to pull project config when starting the
# local stack in CI. Without it, `supabase start` will fail with auth error.
# See docs/ci-secrets.md for full provisioning guide.
# =============================================================================

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pgtap:
    name: Run pgTAP suites against fresh Supabase DB
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Lint RLS org_id coverage (delta mode — scoped to changed files)
      #    Runs BEFORE any Supabase infra to fail fast on static analysis.
      #    On pull_request: diffs against origin/<base_ref>.
      #    On push to main:  diffs most recent commit (HEAD~1..HEAD).
      #    Skips gracefully when no migration files were touched.
      # -----------------------------------------------------------------------
      - name: Lint RLS org_id coverage
        run: |
          # Fetch enough history for an accurate diff (shallow clone only has HEAD)
          git fetch --depth=50 origin "${{ github.base_ref || 'main' }}" 2>/dev/null || true

          # Collect non-rollback migration files changed in this event
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only \
              "origin/${{ github.base_ref }}...HEAD" \
              -- 'supabase/migrations/*.sql' \
              | grep -v '_rollback' || true)
          else
            # push to main: scope to files in the most recent commit
            CHANGED=$(git diff --name-only HEAD~1 HEAD \
              -- 'supabase/migrations/*.sql' \
              | grep -v '_rollback' || true)
          fi

          if [ -z "$CHANGED" ]; then
            echo "[lint-rls-org-id] No migration files changed — skipping lint."
            exit 0
          fi

          echo "[lint-rls-org-id] Linting changed files:"
          printf '  %s\n' $CHANGED

          # Pass changed files as positional args (delta mode)
          python3 scripts/lint-rls-org-id.py $CHANGED

      # -----------------------------------------------------------------------
      # 3. Set up Supabase CLI
      # -----------------------------------------------------------------------
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # -----------------------------------------------------------------------
      # 4. Install pg_prove (TAP::Parser::SourceHandler::pgTAP)
      # -----------------------------------------------------------------------
      - name: Install pg_prove and pgTAP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-client \
            libtap-parser-sourcehandler-pgtap-perl
          # pg_prove is provided by the perl package above
          pg_prove --version

      # -----------------------------------------------------------------------
      # 5. Merge 20260828_* migrations into 0172 for correct sort order
      #    Rationale: 20260828_* sorts after 0173_* lexicographically (2 > 0),
      #    so multi_tenant_schema would run AFTER the 0173 guard and fail.
      #    Rename to 0172_z0x_* is NOT viable: Supabase extracts only the
      #    leading numeric portion as the version key, so any 0172_*.sql
      #    gets version=0172 — colliding with 0172_jobs_quotations_invoices.sql.
      #    Strategy (Fix U — split multi_tenant_schema at section boundary):
      #      20260828_multi_tenant_schema.sql has two logical halves:
      #        Part A  (lines 1-86):   CREATE TABLE organizations, org_members,
      #                                org_invitations + their indexes.
      #                                Must come BEFORE 0172 so the FK
      #                                REFERENCES public.organizations in
      #                                multi_tenant_schema section 4 resolves.
      #        Part B  (lines 87-end): ALTER TABLE public.jobs/quotations/
      #                                invoices/ledger_entries ADD COLUMN org_id
      #                                + RLS policies + updated_at trigger.
      #                                Must come AFTER 0172 because 0172 creates
      #                                the jobs/quotations/invoices tables.
      #      Build order: Part A → original 0172 → Part B → five remaining files
      #      All originals are deleted. Ephemeral CI-only transformation.
      # -----------------------------------------------------------------------
      - name: Merge 20260828 migrations into 0172 (split-schema strategy)
        run: |
          cd supabase/migrations

          # Split multi_tenant_schema.sql at the section 4 boundary (line 86/87)
          # Part A: CREATE TABLE orgs/members/invitations + indexes (lines 1-86)
          # Part B: ALTER TABLE org_id additions + RLS + trigger  (lines 87-end)
          head -n 86 20260828_multi_tenant_schema.sql > mts_part_a.sql
          tail -n +87 20260828_multi_tenant_schema.sql > mts_part_b.sql

          # Build merged 0172: Part A + original 0172 + Part B
          {
            echo "-- ============================================================"
            echo "-- Merged from: 20260828_multi_tenant_schema.sql Part A (lines 1-86)"
            echo "-- CREATE TABLE organizations / org_members / org_invitations"
            echo "-- ============================================================"
            cat mts_part_a.sql
            echo ""
            echo "-- ============================================================"
            echo "-- Original: 0172_jobs_quotations_invoices.sql"
            echo "-- ============================================================"
            cat 0172_jobs_quotations_invoices.sql
            echo ""
            echo "-- ============================================================"
            echo "-- Merged from: 20260828_multi_tenant_schema.sql Part B (lines 87-end)"
            echo "-- ALTER TABLE org_id / RLS policies / updated_at trigger"
            echo "-- ============================================================"
            cat mts_part_b.sql
          } > 0172_merged_tmp.sql
          mv 0172_merged_tmp.sql 0172_jobs_quotations_invoices.sql
          rm 20260828_multi_tenant_schema.sql mts_part_a.sql mts_part_b.sql

          # APPEND remaining 20260828_* files in dependency order
          for f in \
            20260828_audit_log_usage_metering.sql \
            20260828_notifications_super_admin.sql \
            20260828_platform_fts.sql \
            20260828_platform_search.sql \
            20260828_search_bookmarks_autocomplete.sql; do
            echo "" >> 0172_jobs_quotations_invoices.sql
            echo "-- ============================================================" >> 0172_jobs_quotations_invoices.sql
            echo "-- Merged from: $f" >> 0172_jobs_quotations_invoices.sql
            echo "-- ============================================================" >> 0172_jobs_quotations_invoices.sql
            cat "$f" >> 0172_jobs_quotations_invoices.sql
            rm "$f"
          done

          echo "20260828_* files merged and removed. Final 0172 line count:"
          wc -l 0172_jobs_quotations_invoices.sql

      # -----------------------------------------------------------------------
      # 6. Start Supabase local stack
      #    Requires: SUPABASE_ACCESS_TOKEN repository secret
      #    Provision: Settings → Secrets and variables → Actions
      #    Source:    app.supabase.com → Account → Access Tokens
      # -----------------------------------------------------------------------
      - name: Start Supabase local stack
        run: supabase start
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # -----------------------------------------------------------------------
      # 7. Apply all migrations (db reset runs migrations from scratch)
      #    NOTE: rollback scripts live in supabase/rollbacks/ (not migrations/)
      #    so they are NOT applied by db reset. This avoids duplicate publication
      #    membership errors (SQLSTATE 42710) that occur when rollback SQL runs
      #    as a forward migration in CI.
      # -----------------------------------------------------------------------
      - name: Reset database and apply migrations
        run: supabase db reset --local

      # -----------------------------------------------------------------------
      # 8. Enable pgTAP extension
      # -----------------------------------------------------------------------
      - name: Enable pgTAP extension
        run: |
          DB_URL=$(supabase status --output env | grep DB_URL | cut -d= -f2-)
          psql "$DB_URL" -c "CREATE EXTENSION IF NOT EXISTS pgtap;"
        env:
          PGPASSWORD: postgres

      # -----------------------------------------------------------------------
      # 9. Run pg_prove on all test files
      #    Runs: supabase/tests/*.sql — 511 total pgTAP assertions:
      #      • 474  forward migration tests
      #             (0179 F1: 14 · 0179 NNB: 35 · 0180: 17 · 0181: 18 · 0182: 13 · 0183: 13 ·
      #              0176 notification_preferences: 16 · 0186 critical_tables: 20 ·
      #              0187 installation_domain: 53 · 0188 factory_domain: 25 ·
      #              0189 line_oa_domain: 49)
#              0190 finance_accounting_domain: 45)
#              0191 package_sales_domain: 35)
#              0192 capture_documents_domain: 35)
#              0193 site_field_ops_domain: 35)
#              0194 operational_misc_domain: 51)
      #      •  12  rollback verification tests (0183_rollback_verification.sql)
      #      •  25  cross-tenant isolation tests (cross_tenant_isolation.sql:
      #             T01–T02 setup · T03–T08 SELECT · T09–T12 INSERT 42501 ·
      #             T13–T14 UPDATE · T23–T25 DELETE · T15–T17 own-org · T18–T22 integrity)
      #    Fails the job if any TAP assertion fails.
      # -----------------------------------------------------------------------
      - name: Run pg_prove on supabase/tests/*.sql
        run: |
          DB_URL=$(supabase status --output env | grep DB_URL | cut -d= -f2-)
          pg_prove \
            --dbname "$DB_URL" \
            --recursive \
            --verbose \
            supabase/tests/*.sql
        env:
          PGPASSWORD: postgres

      # -----------------------------------------------------------------------
      # 10. Stop Supabase local stack (cleanup — always runs)
      # -----------------------------------------------------------------------
      - name: Stop Supabase local stack
        if: always()
        run: supabase stop
