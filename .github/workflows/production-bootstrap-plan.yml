name: Production Bootstrap Plan (no writes)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/create_production_bootstrap_plan.sh"
      - "scripts/prepare_supabase_migrations_ci.sh"
      - ".github/workflows/production-bootstrap-plan.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-hosted:
    name: Inspect hosted schema (read-only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      PGOPTIONS: "-c default_transaction_read_only=on"

    steps:
      - name: Validate target credentials
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::DATABASE_URL and SUPABASE_PROJECT_REF are required."
            exit 1
          fi
          if [[ "$DATABASE_URL" != postgres://* && "$DATABASE_URL" != postgresql://* ]]; then
            echo "::error::DATABASE_URL must be a full PostgreSQL connection URI."
            exit 1
          fi
          if [[ "$DATABASE_URL" != *"$SUPABASE_PROJECT_REF"* ]]; then
            echo "::error::DATABASE_URL does not target SUPABASE_PROJECT_REF."
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Capture hosted bootstrap inventory
        run: |
          count_rows_if_present() {
            local relation="$1"
            if [ "$(psql "$DATABASE_URL" --no-psqlrc -tA -v ON_ERROR_STOP=1 \
              -c "SELECT to_regclass('$relation') IS NOT NULL;")" = "t" ]; then
              psql "$DATABASE_URL" --no-psqlrc -tA -v ON_ERROR_STOP=1 \
                -c "SELECT count(*) FROM $relation;"
            else
              echo 0
            fi
          }

          AUTH_USER_COUNT="$(count_rows_if_present auth.users)"
          STORAGE_OBJECT_COUNT="$(count_rows_if_present storage.objects)"
          MIGRATION_HISTORY_COUNT="$(count_rows_if_present supabase_migrations.schema_migrations)"

          psql "$DATABASE_URL" \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            -v ON_ERROR_STOP=1 \
            -v auth_user_count="$AUTH_USER_COUNT" \
            -v storage_object_count="$STORAGE_OBJECT_COUNT" \
            -v migration_history_count="$MIGRATION_HISTORY_COUNT" \
            -c "WITH public_tables AS (
                  SELECT c.relname
                  FROM pg_catalog.pg_class c
                  JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
                  WHERE n.nspname = 'public'
                    AND c.relkind IN ('r', 'p')
                    AND NOT EXISTS (
                      SELECT 1
                      FROM pg_catalog.pg_depend d
                      WHERE d.classid = 'pg_class'::regclass
                        AND d.objid = c.oid
                        AND d.deptype = 'e'
                    )
                ), core_state AS (
                  SELECT jsonb_build_object(
                    'organizations', to_regclass('public.organizations') IS NOT NULL,
                    'orgMembers', to_regclass('public.org_members') IS NOT NULL,
                    'superAdmins', to_regclass('public.super_admins') IS NOT NULL,
                    'notificationDigestQueue', to_regclass('public.notification_digest_queue') IS NOT NULL,
                    'platformMetricsSnapshots', to_regclass('public.platform_metrics_snapshots') IS NOT NULL
                  ) AS value
                )
                SELECT jsonb_build_object(
                  'database', current_database(),
                  'serverVersionNum', current_setting('server_version_num')::integer,
                  'publicUserTableCount', (SELECT count(*) FROM public_tables),
                  'publicUserTables', COALESCE((SELECT jsonb_agg(relname ORDER BY relname) FROM public_tables), '[]'::jsonb),
                  'coreTables', (SELECT value FROM core_state),
                  'authUserCount', :'auth_user_count'::integer,
                  'storageObjectCount', :'storage_object_count'::integer,
                  'migrationHistoryCount', :'migration_history_count'::integer,
                  'bootstrapCandidate', (
                    (SELECT count(*) FROM public_tables) = 0
                    AND NOT (
                      SELECT bool_or(entries.value::boolean)
                      FROM core_state
                      CROSS JOIN LATERAL jsonb_each_text(core_state.value) AS entries
                    )
                  ),
                  'productionWritesPerformed', false
                );" > hosted-bootstrap-inventory.json

          jq . hosted-bootstrap-inventory.json

      - name: Upload hosted inventory
        uses: actions/upload-artifact@v4
        with:
          name: hosted-bootstrap-inventory-${{ github.sha }}
          path: hosted-bootstrap-inventory.json
          retention-days: 30

  validate-plan:
    name: Validate exact bootstrap bundle locally
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      - name: Install PostgreSQL and pgTAP tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-client \
            libtap-parser-sourcehandler-pgtap-perl

      - name: Render deterministic bootstrap plan
        run: bash scripts/create_production_bootstrap_plan.sh bootstrap-plan

      - name: Apply rendered bundle to a fresh local Supabase database
        working-directory: bootstrap-plan
        run: supabase start

      - name: Verify core schema and run all pgTAP assertions
        run: |
          DB_URL="postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres"

          psql "$DB_URL" -tA -v ON_ERROR_STOP=1 -c "SELECT jsonb_build_object(
            'migrationsApplied', (SELECT count(*) FROM supabase_migrations.schema_migrations),
            'coreSchemaReady', (
              to_regclass('public.organizations') IS NOT NULL
              AND to_regclass('public.org_members') IS NOT NULL
              AND to_regclass('public.super_admins') IS NOT NULL
              AND to_regclass('public.notification_digest_queue') IS NOT NULL
              AND to_regclass('public.platform_metrics_snapshots') IS NOT NULL
            ),
            'productionWritesPerformed', false
          );" | tee bootstrap-plan/local-bootstrap-result.json

          jq -e '.coreSchemaReady == true and .migrationsApplied > 0' \
            bootstrap-plan/local-bootstrap-result.json >/dev/null

          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS pgtap;"
          pg_prove \
            --dbname "$DB_URL" \
            --verbose \
            bootstrap-plan/supabase/tests/*.sql \
            | tee bootstrap-plan/bootstrap-pgtap.tap

          if ! grep -qE '^ok ' bootstrap-plan/bootstrap-pgtap.tap; then
            echo "::error::No pgTAP assertions ran against the rendered bundle."
            exit 1
          fi

      - name: Upload exact reviewed bootstrap plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-bootstrap-plan-${{ github.sha }}
          path: |
            bootstrap-plan/plan-summary.json
            bootstrap-plan/migration-manifest.tsv
            bootstrap-plan/local-bootstrap-result.json
            bootstrap-plan/bootstrap-pgtap.tap
            bootstrap-plan/supabase/migrations/
          retention-days: 30

      - name: Stop local Supabase
        if: always()
        working-directory: bootstrap-plan
        run: supabase stop --no-backup || true
