<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>MONOLITH · LINE Flex Studio</title>
  <link rel="stylesheet" href="./line-flex-studio.css">
</head>
<body>
  <a class="skip-link" href="#studio-main">ข้ามไปพื้นที่ทำงาน</a>
  <header class="app-header">
    <div class="platform-brand"><span class="platform-mark">M</span>
      <span><b>MONOLITH</b><small>LINE Flex Studio</small></span></div>
    <div id="tenant-context" class="tenant-context" aria-label="Current tenant"></div>
    <button id="language-toggle" type="button" aria-pressed="false">TH / EN</button>
  </header>
  <main id="studio-main" class="studio-grid">
    <section id="pane-editor" class="editor-pane" role="tabpanel" aria-labelledby="pane-tab-editor" tabindex="-1">
      <h1 id="editor-title">สตูดิโอ Flex Message</h1>
      <div id="preset-list" role="list" aria-label="Message presets"></div>
      <div id="block-tabs" role="tablist" aria-label="Flex blocks"></div>
      <form id="field-panel" role="tabpanel" aria-labelledby="block-tab-header" novalidate></form>
    </section>
    <section id="pane-preview" class="preview-pane" role="tabpanel" aria-labelledby="pane-tab-preview" tabindex="-1">
      <div class="pane-title"><h2 id="preview-title">ตัวอย่าง LINE</h2>
        <div id="viewport-switcher" role="group" aria-label="Preview width"></div></div>
      <div class="phone-frame"><div id="phone-preview"></div></div>
      <button id="run-journey" type="button">ทดลอง Journey</button>
    </section>
    <section id="pane-code" class="code-pane" role="tabpanel" aria-labelledby="pane-tab-code" tabindex="-1">
      <div class="pane-title"><h2 id="json-title">ตัวอย่าง JSON</h2>
        <output id="payload-count"></output></div>
      <pre><code id="json-output"></code></pre>
      <div class="button-row">
        <button id="copy-json" type="button">คัดลอก JSON</button>
        <button id="download-json" type="button">ดาวน์โหลด JSON</button>
        <button id="reset-draft" type="button">คืนค่า</button>
      </div>
      <h2 id="validation-title">การตรวจสอบ</h2>
      <ol id="validation-list"></ol>
    </section>
  </main>
  <dialog id="liff-dialog" aria-labelledby="liff-title">
    <h2 id="liff-title">ตรวจแบบส่วนตัว · Demo</h2>
    <div data-liff-review></div>
    <div class="button-row"><button id="cancel-journey" type="button" value="cancel">ยกเลิก</button>
      <button id="confirm-journey" type="button" data-confirm-demo value="confirm">ยืนยันเจตนาใน Demo</button></div>
  </dialog>
  <dialog id="receipt-dialog" aria-labelledby="receipt-title">
    <h2 id="receipt-title">Verification Receipt — Demo</h2>
    <div data-receipt></div><button id="close-receipt" type="button" data-close-receipt>ปิด</button>
  </dialog>
  <p id="toast-live" class="sr-only" aria-live="polite"></p>
  <script type="module" src="./line-flex-studio.mjs"></script>
</body>
</html>
