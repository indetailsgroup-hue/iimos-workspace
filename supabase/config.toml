# supabase/config.toml
# Supabase CLI project configuration for: monolith-workspace
# Docs: https://supabase.com/docs/guides/cli/config
# ---------------------------------------------------------------------------
# To apply: supabase db push   (migrations)
#           supabase functions deploy etax-submit-worker
#           supabase functions deploy notify-overdue
# ---------------------------------------------------------------------------

[project]
project_id = "monolith-workspace"   # replace with your real Supabase project ref

# ---------------------------------------------------------------------------
# API
# ---------------------------------------------------------------------------
[api]
enabled       = true
port          = 54321
schemas       = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows      = 1000

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
[db]
port          = 54322
shadow_port   = 54320
major_version = 15

[db.pooler]
enabled        = false
port           = 54329
pool_mode      = "transaction"
default_pool_size  = 20
max_client_conn    = 100

# ---------------------------------------------------------------------------
# Auth
# ---------------------------------------------------------------------------
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry     = 3600
enable_refresh_token_rotation    = true
refresh_token_reuse_interval     = 10
enable_signup                    = true
enable_anonymous_sign_ins        = false
minimum_password_length          = 8

[auth.email]
enable_signup          = true
double_confirm_changes = true
enable_confirmations   = false

[auth.sms]
enable_signup = false

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
[storage]
enabled = true
# Buckets are created via migrations (0183 creates etax-pdfs).
# file_size_limit applies globally; per-bucket limits set in migrations.
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = false

# ---------------------------------------------------------------------------
# Edge Functions
# ---------------------------------------------------------------------------

# etax-submit-worker
# Polls etax_submissions WHERE status='queued', generates UBL 2.1 XML,
# submits to Thai Revenue Department API, then optionally downloads the
# resulting PDF into etax-pdfs storage bucket.
[functions.etax-submit-worker]
verify_jwt = false          # Called by pg_cron via pg_net (no JWT available)
import_map = "./functions/etax-submit-worker/import_map.json"

# Required secrets (set with: supabase secrets set KEY=VALUE):
#   ETAX_PROVIDER_URL   - Thai RD / ETDA provider base URL
#   ETAX_API_KEY        - API key / token for the RD provider
#   ETAX_SELLER_TAX_ID  - Organisation's Thai tax ID (13 digits)
#   ETAX_SELLER_NAME    - Organisation's registered name (Thai)
#   SUPABASE_URL        - Auto-injected
#   SUPABASE_SERVICE_ROLE_KEY - Auto-injected

# notify-overdue
# Calls rpc_check_overdue_invoices, then sends LINE Notify / Resend email
# alerts per organisation's notification_settings (added in 0182).
[functions.notify-overdue]
verify_jwt = false          # Called by pg_cron via pg_net
import_map = "./functions/notify-overdue/import_map.json"

# Required secrets:
#   LINE_NOTIFY_TOKEN   - LINE Notify channel access token (per org or global)
#   RESEND_API_KEY      - Resend (email) API key
#   CRON_SECRET         - Shared secret validated by the function
#   SUPABASE_URL        - Auto-injected
#   SUPABASE_SERVICE_ROLE_KEY - Auto-injected

# ---------------------------------------------------------------------------
# Studio (local dev only)
# ---------------------------------------------------------------------------
[studio]
enabled = true
port    = 54323
api_url = "http://127.0.0.1"

# ---------------------------------------------------------------------------
# Inbucket (local email capture)
# ---------------------------------------------------------------------------
[inbucket]
enabled    = true
port       = 54324
smtp_port  = 54325
pop3_port  = 54326

# ---------------------------------------------------------------------------
# Analytics
# ---------------------------------------------------------------------------
[analytics]
enabled = false

# ---------------------------------------------------------------------------
# SCHEDULED JOBS — pg_cron configuration
# ---------------------------------------------------------------------------
# pg_cron is enabled in Supabase Pro/Team plans (and in local dev via supabase start).
# Jobs are registered via SQL migrations; supabase/config.toml has no native [cron]
# section — this block is documentation only.
#
# ┌─────────────────────────────────┬──────────────────┬───────────────────────────────┐
# │ Job name                        │ Schedule         │ Migration / Source            │
# ├─────────────────────────────────┼──────────────────┼───────────────────────────────┤
# │ etax-submit-worker              │ */5  * * * *     │ 0184_scheduled_jobs.sql       │
# │   → Edge Fn: etax-submit-worker │ (every 5 min)    │   calls pg_net HTTP POST      │
# ├─────────────────────────────────┼──────────────────┼───────────────────────────────┤
# │ notify-overdue                  │ 0 1  * * *       │ 0184_scheduled_jobs.sql       │
# │   → Edge Fn: notify-overdue     │ (01:00 UTC /     │   calls pg_net HTTP POST      │
# │                                 │  08:00 ICT daily)│                               │
# ├─────────────────────────────────┼──────────────────┼───────────────────────────────┤
# │ refresh-etax-compliance-mv      │ */15 * * * *     │ 0187_etax_compliance_         │
# │   → DB fn: fn_refresh_          │ (every 15 min)   │   dashboard_mv.sql            │
# │     etax_compliance_mv()        │                  │   Pure SQL — no edge fn       │
# ├─────────────────────────────────┼──────────────────┼───────────────────────────────┤
# │ check-mv-refresh-lag            │ */5  * * * *     │ 0188_mv_refresh_lag_alert.sql │
# │   → DB fn: fn_mv_refresh_       │ (every 5 min)    │   Pure SQL — no edge fn       │
# │     lag_alert()                 │                  │   Inserts alert into          │
# │                                 │                  │   etax_submission_audit_log   │
# │                                 │                  │   when lag > 1800 s (30 min)  │
# └─────────────────────────────────┴──────────────────┴───────────────────────────────┘
#
# How to register jobs in production / staging:
#   1. Run `supabase db push` — migrations 0184, 0187, 0188 call cron.schedule()
#      which registers the jobs automatically.
#   2. Verify in Supabase Dashboard → Database → Extensions → pg_cron → Cron Jobs.
#   3. Or query: SELECT jobname, schedule, command FROM cron.job ORDER BY jobname;
#
# How to unschedule a job manually:
#   SELECT cron.unschedule('<job-name>');
#
# Secrets required by edge-function-backed jobs (etax-submit-worker, notify-overdue):
#   supabase secrets set ETAX_PROVIDER_URL=...  ETAX_API_KEY=...
#                        ETAX_SELLER_TAX_ID=... ETAX_SELLER_NAME=...
#                        RESEND_API_KEY=...      LINE_NOTIFY_TOKEN=...
#                        CRON_SECRET=...
#
# DB-only jobs (refresh-etax-compliance-mv, check-mv-refresh-lag) have no secrets;
# they run as the postgres role (SECURITY DEFINER functions).
# ---------------------------------------------------------------------------
