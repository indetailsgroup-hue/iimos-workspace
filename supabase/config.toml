# =============================================================================
# supabase/config.toml — Monolith Manufacturing OS (FPR sub-system)
# Registers Deno Edge Functions for the field-purchase module.
# Apply: supabase db push   (or apply_migrations.sh for raw SQL)
# =============================================================================

[api]
enabled = true
port    = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port          = 54322
shadow_port   = 54320
major_version = 15

[studio]
enabled = true
port    = 54323

[inbucket]
enabled = true
port    = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true

[auth]
enabled      = true
site_url     = "http://localhost:3000"
jwt_expiry   = 3600
enable_signup = true

# ─────────────────────────────────────────────────────────────────────────────
# Edge Functions
# ─────────────────────────────────────────────────────────────────────────────

# FPR LINE Webhook Handler
# Source: line_webhook_handler.ts (project root — symlinked or copied to function folder)
# Receives inbound LINE webhook events for the FPR channel.
# HMAC-SHA256 signature verified inline; no JWT verification by LINE gateway.
[functions.field-purchase-line]
enabled      = true
verify_jwt   = false   # LINE calls this directly with x-line-signature header
import_map   = "./import_map.json"

# LINE OA Dispatch Worker
# Source: line_oa_dispatch_worker.ts (project root — symlinked or copied to function folder)
# Drains pending line_oa_outbound_messages rows and POSTs to LINE Messaging API.
# Called by pg_notify trigger (0197) or directly via Bearer SERVICE_ROLE_KEY.
[functions.line-oa-dispatch-worker]
enabled    = true
verify_jwt = true    # Requires Bearer SERVICE_ROLE_KEY or x-invoke-key header

# ─────────────────────────────────────────────────────────────────────────────
# pg_cron schedules registered in migrations
# (listed here for documentation; actual registration is in SQL migrations)
#
#   fpr-expire-sessions          */15 * * * *   (0179) fn_expire_fpr_sessions
#   fpr-summary-refresh          0    * * * *   (0186) rpc_refresh_fpr_summary
#   fpr-retry-notifications      */10 * * * *   (0196) rpc_retry_fpr_notifications
#   fpr-auto-uncancel            0    2 * * *   (0205) fn_cron_auto_uncancel_stale_fpr
# ─────────────────────────────────────────────────────────────────────────────
